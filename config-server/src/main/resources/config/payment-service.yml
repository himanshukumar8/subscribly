server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: subscribly_user
    password: 1
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  app:
    name: Payment Service
    description: Subscribly Production Payment Platform Microservice
    version: 1.0.0

razorpay:
  key-id: "rzp_test_mockKeyId"
  key-secret: "rzp_test_mockSecretKey12345"
  webhook-secret: "rzp_test_mockWebhookSecret12345"
