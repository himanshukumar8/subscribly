server:
  port: 8084

spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
  mail:
    host: localhost
    port: 1025
    test-connection: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  app:
    name: Notification Service
    description: Subscribly Multi-Channel Notification Service (Email, SMS, Push, Webhooks)
    version: 1.0.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
