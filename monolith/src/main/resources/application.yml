server:
  port: ${PORT:8089}
  forward-headers-strategy: framework

spring:
  application:
    name: monolith
  cloud:
    compatibility-verifier:
      enabled: false
  config:
    import: "optional:configserver:http://localhost:8888/"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscribly}
    username: ${SPRING_DATASOURCE_USERNAME:subscribly_user}
    password: ${SPRING_DATASOURCE_PASSWORD:1}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Auto-create tables (for development/testing; prod profile uses validate)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:false}   # Enabled in prod / CI migration verification
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  devtools:
    restart:
      enabled: false   # <<< IMPORTANT: disables old config reload

  jackson:
    serialization:
      fail-on-empty-beans: false

# Payment Gateway Externalized Configuration (Sandbox Defaults with Env Overrides)
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mockKeyId}
  key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_mockSecretKey12345}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_test_mockWebhookSecret12345}
  api-url: ${RAZORPAY_API_URL:https://api.razorpay.com/v1}
  live-call-enabled: ${RAZORPAY_LIVE_CALL_ENABLED:false}
  connect-timeout-ms: ${RAZORPAY_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${RAZORPAY_READ_TIMEOUT_MS:10000}

# JWT Signing Key Externalized Configuration
jwt:
  secret: ${JWT_SECRET:local-development-only-jwt-secret-not-for-prod-32bytes-min!}


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  app:
    name: Monolith Core Service
    description: Subscribly Legacy Core (Subscription & Payment domains pending extraction)
    version: 1.0.0

logging:
  level:
    org.hibernate.SQL: debug

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
