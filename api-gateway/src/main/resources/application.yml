server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:8888/"
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
            allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-user
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**
        - id: user-service-admin-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/users/**
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/v1/subscription/**
        - id: subscription-service-admin
          uri: lb://subscription-service
          predicates:
            - Path=/api/v1/admin/subscriptions/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payment/**,/api/v1/payments/**
        - id: payment-service-admin
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/admin/payments/**
        - id: monolith
          uri: lb://monolith
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
    info:
      enabled: true

info:
  app:
    name: API Gateway Service
    description: Subscribly Gateway routing traffic to microservices
    version: 1.0.0

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
